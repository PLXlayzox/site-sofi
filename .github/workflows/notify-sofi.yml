name: Notify Sofi (forum)

# Envoie un mail à Sophie à chaque nouveau message du forum.
# Requiert un secret GitHub : SMTP_PASSWORD = mot de passe d'application Gmail
# (Compte lenfantbilly10@gmail.com → Sécurité → Mots de passe d'application)

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

jobs:
  push-notification:
    # Notif push instantanée via ntfy.sh (Sophie installe l'app ntfy sur
    # son téléphone → subscribe au topic secret). Aucun compte requis.
    # Secret NTFY_URL = https://ntfy.sh/<topic-secret> (à définir).
    # Se skip silencieusement si le secret n'est pas configure.
    runs-on: ubuntu-latest
    steps:
      - name: Send ntfy push
        if: env.NTFY_URL != ''
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ "${{ github.event_name }}" = "discussion" ]; then
            TITLE="Nouveau sujet : ${{ github.event.discussion.title }}"
            BODY="${{ github.event.sender.login }} vient d'ouvrir un sujet"
            LINK="${{ github.event.discussion.html_url }}"
          else
            TITLE="Nouveau commentaire de ${{ github.event.comment.user.login }}"
            BODY="Sur : ${{ github.event.discussion.title }}"
            LINK="${{ github.event.comment.html_url }}"
          fi
          curl -s "$NTFY_URL" \
            -H "Title: Forum Sofi — $TITLE" \
            -H "Priority: default" \
            -H "Tags: speech_balloon,artist" \
            -H "Click: $LINK" \
            -H "Actions: view, Voir le message, $LINK" \
            -d "$BODY"

  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send email to Sofi
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: lenfantbilly10@gmail.com
          password: ${{ secrets.SMTP_PASSWORD }}
          from: "Forum Sofi <lenfantbilly10@gmail.com>"
          to: sophielenfant24@proton.me
          reply_to: lenfantbilly10@gmail.com
          subject: >-
            [Forum Sofi] ${{
              github.event_name == 'discussion'
                && format('Nouveau sujet : {0}', github.event.discussion.title)
                || format('Nouveau commentaire de {0}', github.event.comment.user.login)
            }}
          html_body: |
            <div style="font-family: -apple-system, sans-serif; max-width: 640px; margin: 0 auto; padding: 24px; color: #2c4a5c;">
              <h2 style="border-bottom: 2px solid #a68a5b; padding-bottom: 8px;">
                Forum étudiants — nouveau message
              </h2>
              <p><strong>Auteur :</strong> ${{ github.event.sender.login }}</p>
              ${{
                github.event_name == 'discussion'
                  && format('<p><strong>Sujet :</strong> {0}</p><blockquote style="border-left: 3px solid #a68a5b; padding: 8px 16px; background: #f4efe6;">{1}</blockquote>',
                            github.event.discussion.title,
                            github.event.discussion.body)
                  || format('<p><strong>Sur le sujet :</strong> {0}</p><blockquote style="border-left: 3px solid #a68a5b; padding: 8px 16px; background: #f4efe6;">{1}</blockquote>',
                            github.event.discussion.title,
                            github.event.comment.body)
              }}
              <p style="margin-top: 24px;">
                <a href="${{ github.event.discussion.html_url }}"
                   style="display: inline-block; padding: 12px 24px; background: #2c4a5c; color: white; text-decoration: none; border-radius: 999px;">
                  Répondre sur le forum ↗
                </a>
              </p>
              <hr style="border: none; border-top: 1px solid #ddd; margin: 32px 0;" />
              <p style="font-size: 12px; color: #888;">
                Notification automatique du site sofi (art-sofi via GitHub Discussions).
              </p>
            </div>
